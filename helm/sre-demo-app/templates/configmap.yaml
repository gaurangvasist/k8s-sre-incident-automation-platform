apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.app.name }}-config
  labels:
    app.kubernetes.io/name: {{ .Values.app.name }}
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: k8s-sre-incident-automation-platform
data:
  APP_NAME: {{ .Values.app.name | quote }}
  APP_VERSION: {{ .Values.app.version | quote }}
  APP_ENV: {{ .Values.app.environment | quote }}
  COMMIT_SHA: {{ .Values.app.commitSha | quote }}
  READINESS_FAIL: {{ .Values.app.readinessFail | quote }}
  FAIL_STARTUP: {{ .Values.app.failStartup | quote }}
