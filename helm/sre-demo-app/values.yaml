replicaCount: 2

image:
  repository: sre-demo-app
  tag: local
  pullPolicy: Never

app:
  name: sre-demo-app
  version: "0.1.0"
  environment: dev
  commitSha: local
  readinessFail: "false"
  failStartup: "false"

service:
  type: ClusterIP
  port: 80

containerPort: 8080

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "256Mi"

securityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000

probes:
  readiness:
    path: /ready
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  liveness:
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 15
    timeoutSeconds: 2
    failureThreshold: 3